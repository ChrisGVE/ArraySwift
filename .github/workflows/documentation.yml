name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docc:
    name: Build Documentation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Swift Version
        run: swift --version

      - name: Build documentation
        run: swift package generate-documentation --target ArraySwift
